name: beastcontest
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beastcontest
      POSTGRES_USER: beastcontest
      POSTGRES_PASSWORD: ${BEAST_DB_PASSWORD:?Run Start-BeastContest.ps1 first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beastcontest -d beastcontest"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - beast-data:/app/App_Data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Database=beastcontest;Username=beastcontest;Password=${BEAST_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  sandbox:
    image: beastcontest-sandbox:local
    build:
      context: .
      dockerfile: judge/Sandbox.Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  judge:
    build:
      context: .
      dockerfile: judge/Worker.Dockerfile
    environment:
      ConnectionStrings__Database: Host=db;Database=beastcontest;Username=beastcontest;Password=${BEAST_DB_PASSWORD}
      Judge__Image: beastcontest-sandbox:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  beast-data:
  postgres-data:

